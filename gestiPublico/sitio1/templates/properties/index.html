
<div>
    <a href="{% url 'properties_create' %}" class="btn btn-primary">Create property</a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>code</th>
            <th>Address</th>
            <th>Context</th>
        </tr>
    </thead>
    <tbody>

    {% for property in properties %}
        <tr>
            <td>{{ property.id }}</td>
            <td>{{ property.code }}</td>
            <td>{{ property.Address }}</td>
            <td>{{ property.Context }}</td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="4">
                No hay propiedades registradas
            </td>
        </tr>

    {% endfor %}
</table>
