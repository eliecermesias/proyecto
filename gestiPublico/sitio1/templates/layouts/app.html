<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GestiPublico{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202a25;
            --muted: #6c7770;
            --green: #176b4b;
            --line: #e4e9e0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            font: 15px/1.5 "Avenir Next", Avenir, "Segoe UI", sans-serif;
        }
        a { color: inherit; }
        .shell { width: min(1160px, calc(100% - 48px)); margin: auto; }
        .topbar {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            border-bottom: 1px solid #202a251a;
        }
        .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; }
        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            color: white;
            background: var(--green);
            border-radius: 50%;
        }
        .brand-name { font: 700 21px Georgia, "Times New Roman", serif; }
        .brand-name span { color: var(--green); }
        .top-links { display: flex; gap: 27px; color: var(--muted); font-size: 13px; }
        .top-links a { text-decoration: none; }
        .top-links a:hover, .top-links a:focus-visible { color: var(--green); }
        main { min-height: 55vh; }
        .site-footer {
            padding: 18px 0 27px;
            border-top: 1px solid #202a251a;
            color: var(--muted);
            font-size: 11px;
        }
        .footer-inner { display: flex; justify-content: space-between; gap: 15px; }
        @media (max-width: 600px) {
            .shell { width: min(100% - 32px, 1160px); }
            .topbar { min-height: 70px; }
            .top-links { gap: 14px; font-size: 12px; }
            .footer-inner { flex-direction: column; gap: 4px; }
        }
        @media (max-width: 420px) {
            .shell { width: calc(100% - 24px); }
            .brand-name { font-size: 19px; }
            .top-links { gap: 10px; font-size: 11px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include "partials/navbar.html" %}

    <main id="inicio">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    {% block extra_js %}{% endblock %}
</body>
</html>
